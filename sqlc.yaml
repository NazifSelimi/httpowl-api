version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { type: "time.Time", pointer: true }
          - db_type: inet
            go_type: net/netip.Addr
          - db_type: date
            go_type: time.Time
          - db_type: jsonb
            go_type: encoding/json.RawMessage
