# HTTPowl — httpowl.net (API on 127.0.0.1:8090). TLS lines are added by certbot --nginx.
map $http_upgrade $httpowl_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.httpowl.net;
    return 301 https://httpowl.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name httpowl.net;

    # Until the React app is ready this is the landing page; later: root /var/www/httpowl/app + SPA fallback.
    root /var/www/httpowl/landing;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $httpowl_connection_upgrade;
        proxy_read_timeout 1h;
        client_max_body_size 10m;
    }

    # Agent installer: curl -sL https://httpowl.net/install | sudo sh -s -- --token ...
    location = /install     { default_type text/plain; alias /var/www/httpowl/dl/install.sh; }
    location = /install.ps1 { default_type text/plain; alias /var/www/httpowl/dl/install.ps1; }
    location /dl/ { alias /var/www/httpowl/dl/; add_header Cache-Control "no-cache" always; }

    location / { try_files $uri $uri/ /index.html; }
    location ~ /\.(?!well-known) { deny all; }
}
